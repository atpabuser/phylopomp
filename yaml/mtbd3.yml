name: MTBD3
description: General 3-type linear multitype birth-death-sampling process (BDMM, Stadler psi/r parameterization)
details: |-
  A linear multitype birth-death-sampling process on 3 demes (type1..type3),
  following the continuous reaction set of Vaughan & Stadler (2025, MBE).
  Per capita, a type i individual: gives birth to a type j offspring at rate
  lambda_i_j (parent stays type i); migrates i->j at rate m_i_j; is removed
  unobserved at rate mu_i; and is sampled at overall rate psi_i, being removed
  on sampling with probability r_i (SampR, sample_death) or retained with
  probability 1-r_i (SampNR, sampled ancestor). Present-time (rho) sampling and
  skyline time-variation are NOT included. Generated by gen_bdmm.R -- do not
  hand-edit; regenerate.
demes:
  - type1
  - type2
  - type3
parameter:
  lambda_1_1: {name: lambda_1_1, description: birth rate type1 parent -> type1 child, type: double, default: 1.0}
  lambda_1_2: {name: lambda_1_2, description: birth rate type1 parent -> type2 child, type: double, default: 0.1}
  lambda_1_3: {name: lambda_1_3, description: birth rate type1 parent -> type3 child, type: double, default: 0.1}
  lambda_2_1: {name: lambda_2_1, description: birth rate type2 parent -> type1 child, type: double, default: 0.1}
  lambda_2_2: {name: lambda_2_2, description: birth rate type2 parent -> type2 child, type: double, default: 1.0}
  lambda_2_3: {name: lambda_2_3, description: birth rate type2 parent -> type3 child, type: double, default: 0.1}
  lambda_3_1: {name: lambda_3_1, description: birth rate type3 parent -> type1 child, type: double, default: 0.1}
  lambda_3_2: {name: lambda_3_2, description: birth rate type3 parent -> type2 child, type: double, default: 0.1}
  lambda_3_3: {name: lambda_3_3, description: birth rate type3 parent -> type3 child, type: double, default: 1.0}
  m_1_2: {name: m_1_2, description: migration type1 -> type2, type: double, default: 0.0}
  m_1_3: {name: m_1_3, description: migration type1 -> type3, type: double, default: 0.0}
  m_2_1: {name: m_2_1, description: migration type2 -> type1, type: double, default: 0.0}
  m_2_3: {name: m_2_3, description: migration type2 -> type3, type: double, default: 0.0}
  m_3_1: {name: m_3_1, description: migration type3 -> type1, type: double, default: 0.0}
  m_3_2: {name: m_3_2, description: migration type3 -> type2, type: double, default: 0.0}
  mu_1: {name: mu_1, description: unobserved removal rate in type1, type: double, default: 0.5}
  mu_2: {name: mu_2, description: unobserved removal rate in type2, type: double, default: 0.5}
  mu_3: {name: mu_3, description: unobserved removal rate in type3, type: double, default: 0.5}
  psi_1: {name: psi_1, description: overall sampling rate for type1, type: double, default: 0.1}
  psi_2: {name: psi_2, description: overall sampling rate for type2, type: double, default: 0.1}
  psi_3: {name: psi_3, description: overall sampling rate for type3, type: double, default: 0.1}
  r_1: {name: r_1, description: probability a sampled type1 individual is removed, type: double, default: 1.0}
  r_2: {name: r_2, description: probability a sampled type2 individual is removed, type: double, default: 1.0}
  r_3: {name: r_3, description: probability a sampled type3 individual is removed, type: double, default: 1.0}
ivp:
  I1_0: {name: I1_0, description: initial lineages in type1, type: int, default: 1}
  I2_0: {name: I2_0, description: initial lineages in type2, type: int, default: 0}
  I3_0: {name: I3_0, description: initial lineages in type3, type: int, default: 0}
state:
  I1: {name: I1, type: int}
  I2: {name: I2, type: int}
  I3: {name: I3, type: int}
rinit: |-
  state.I1 = params.I1_0;
  state.I2 = params.I2_0;
  state.I3 = params.I3_0;
  graft(type1,params.I1_0);
  graft(type2,params.I2_0);
  graft(type3,params.I3_0);
events:
  birth_1_1:
    rate: params.lambda_1_1 * state.I1
    jump: state.I1 += 1; birth(type1,type1);
  birth_1_2:
    rate: params.lambda_1_2 * state.I1
    jump: state.I2 += 1; birth(type1,type2);
  birth_1_3:
    rate: params.lambda_1_3 * state.I1
    jump: state.I3 += 1; birth(type1,type3);
  birth_2_1:
    rate: params.lambda_2_1 * state.I2
    jump: state.I1 += 1; birth(type2,type1);
  birth_2_2:
    rate: params.lambda_2_2 * state.I2
    jump: state.I2 += 1; birth(type2,type2);
  birth_2_3:
    rate: params.lambda_2_3 * state.I2
    jump: state.I3 += 1; birth(type2,type3);
  birth_3_1:
    rate: params.lambda_3_1 * state.I3
    jump: state.I1 += 1; birth(type3,type1);
  birth_3_2:
    rate: params.lambda_3_2 * state.I3
    jump: state.I2 += 1; birth(type3,type2);
  birth_3_3:
    rate: params.lambda_3_3 * state.I3
    jump: state.I3 += 1; birth(type3,type3);
  mig_1_2:
    rate: params.m_1_2 * state.I1
    jump: state.I1 -= 1; state.I2 += 1; migrate(type1,type2);
  mig_1_3:
    rate: params.m_1_3 * state.I1
    jump: state.I1 -= 1; state.I3 += 1; migrate(type1,type3);
  mig_2_1:
    rate: params.m_2_1 * state.I2
    jump: state.I2 -= 1; state.I1 += 1; migrate(type2,type1);
  mig_2_3:
    rate: params.m_2_3 * state.I2
    jump: state.I2 -= 1; state.I3 += 1; migrate(type2,type3);
  mig_3_1:
    rate: params.m_3_1 * state.I3
    jump: state.I3 -= 1; state.I1 += 1; migrate(type3,type1);
  mig_3_2:
    rate: params.m_3_2 * state.I3
    jump: state.I3 -= 1; state.I2 += 1; migrate(type3,type2);
  death_1:
    rate: params.mu_1 * state.I1
    jump: state.I1 -= 1; death(type1);
  death_2:
    rate: params.mu_2 * state.I2
    jump: state.I2 -= 1; death(type2);
  death_3:
    rate: params.mu_3 * state.I3
    jump: state.I3 -= 1; death(type3);
  sampdeath_1:
    rate: params.r_1 * params.psi_1 * state.I1
    jump: state.I1 -= 1; sample_death(type1);
  sampdeath_2:
    rate: params.r_2 * params.psi_2 * state.I2
    jump: state.I2 -= 1; sample_death(type2);
  sampdeath_3:
    rate: params.r_3 * params.psi_3 * state.I3
    jump: state.I3 -= 1; sample_death(type3);
  samp_1:
    rate: (1 - params.r_1) * params.psi_1 * state.I1
    jump: sample(type1);
  samp_2:
    rate: (1 - params.r_2) * params.psi_2 * state.I2
    jump: sample(type2);
  samp_3:
    rate: (1 - params.r_3) * params.psi_3 * state.I3
    jump: sample(type3);
